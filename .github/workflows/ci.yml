name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup reads rust-toolchain.toml, so this installs the pinned version.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: cargo xtask ci
        run: cargo xtask ci
